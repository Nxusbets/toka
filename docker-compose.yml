name: toka

services:
  # ===================== INFRASTRUCTURE =====================
  postgres:
    image: postgres:16-alpine
    container_name: toka-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-toka_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toka_pass_2024}
      POSTGRES_DB: ${POSTGRES_DB:-toka_auth}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-toka_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: toka-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-toka_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-toka_pass_2024}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-toka_audit}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: toka-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-toka_pass_2024}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: toka-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-toka_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-toka_pass_2024}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: toka-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  lemma:
    image: node:20-alpine
    container_name: toka-lemma
    working_dir: /app
    command: sh -c "npx @nxuss/lemma@latest init --yes && npx @nxuss/lemma@latest start"
    ports:
      - "8081:8081"
      - "8082:8082"
    environment:
      LEMMA_PORT: 8081
      LEMMA_DASHBOARD_PORT: 8082
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - lemma_data:/app/.lemma
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8081/v1/models"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ===================== MICROSERVICES =====================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: toka-auth-service
    environment:
      APP_MODULE: src.api.main:app
      SERVICE_NAME: auth-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-toka_user}:${POSTGRES_PASSWORD:-toka_pass_2024}@postgres:5432/${POSTGRES_DB:-toka_auth}
      REDIS_URL: redis://:${REDIS_PASSWORD:-toka_pass_2024}@redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-toka_user}:${RABBITMQ_PASSWORD:-toka_pass_2024}@rabbitmq:5672/
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-key-change-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      USER_SERVICE_URL: http://user-service:8000
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: toka-user-service
    environment:
      APP_MODULE: src.api.main:app
      SERVICE_NAME: user-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-toka_user}:${POSTGRES_PASSWORD:-toka_pass_2024}@postgres:5432/${POSTGRES_DB:-toka_auth}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-toka_user}:${RABBITMQ_PASSWORD:-toka_pass_2024}@rabbitmq:5672/
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-key-change-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      AUTH_SERVICE_URL: http://auth-service:8000
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  audit-service:
    build:
      context: ./services/audit-service
      dockerfile: Dockerfile
    container_name: toka-audit-service
    environment:
      SERVICE_NAME: audit-service
      MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-toka_user}:${MONGO_INITDB_ROOT_PASSWORD:-toka_pass_2024}@mongodb:27017/${MONGO_INITDB_DATABASE:-toka_audit}?authSource=admin
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-toka_user}:${RABBITMQ_PASSWORD:-toka_pass_2024}@rabbitmq:5672/
    ports:
      - "8003:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ai-agent-service:
    build:
      context: ./services/ai-agent-service
      dockerfile: Dockerfile
    container_name: toka-ai-agent-service
    environment:
      SERVICE_NAME: ai-agent-service
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      LEMMA_URL: ${LEMMA_URL:-http://lemma:8081/v1}
      USER_SERVICE_URL: http://user-service:8000
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-toka_user}:${RABBITMQ_PASSWORD:-toka_pass_2024}@rabbitmq:5672/
    ports:
      - "8004:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      lemma:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: toka-api-gateway
    environment:
      APP_MODULE: src.api.main:app
      SERVICE_NAME: api-gateway
      AUTH_SERVICE_URL: http://auth-service:8000
      USER_SERVICE_URL: http://user-service:8000
      AUDIT_SERVICE_URL: http://audit-service:8000
      AI_AGENT_SERVICE_URL: http://ai-agent-service:8000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-key-change-in-production}
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - user-service
      - audit-service
      - ai-agent-service

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: toka-frontend
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  rabbitmq_data:
  qdrant_data:
  lemma_data:
